  <style>
    :root { color-scheme: dark; background: transparent; }
    .region { outline: none; }
    .territorio { fill: var(--color); fill-opacity: .40; stroke: #0a122a; stroke-width: 1; transition: fill-opacity .18s; }
    .conector { fill: none; stroke: var(--color); stroke-width: 1; opacity: .72; }
    .pin { fill: var(--color); stroke: #0a122a; stroke-width: 2; }
    .etiqueta { fill: #131a33; stroke: var(--color); stroke-width: 1.5; transition: fill .18s; }
    .nombre { fill: var(--rotulo, var(--color)); font: 700 10px system-ui, sans-serif; letter-spacing: .5px; }
    .danza { fill: #dbe1ff; font: 650 12px system-ui, sans-serif; }
    .region:hover .territorio, .region:focus-visible .territorio { fill-opacity: .86; }
    .region:hover .etiqueta, .region:focus-visible .etiqueta { fill: #212942; stroke-width: 2.5; }
    .vista-previa { opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity .18s, transform .18s; }
    .region:hover .vista-previa, .region:focus-visible .vista-previa { opacity: 1; transform: none; }
    .vista-marco { fill: #131a33; stroke: var(--color); stroke-width: 1.5; }
    .vista-region { fill: var(--color); font: 700 9px system-ui, sans-serif; letter-spacing: .5px; }
    .vista-danza { fill: #dbe1ff; font: 700 12px system-ui, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .territorio, .etiqueta, .vista-previa { transition: none; } }
  </style>
